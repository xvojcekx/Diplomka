<!DOCTYPE html>
<html lang="cs" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generátor grafových zadání pro předmět Teorie Grafů — Mendelova univerzita v Brně">
    <title>{% block title %}Teorie Grafů{% endblock %} — MENDELU</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css?v=2" rel="stylesheet">

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm border-bottom border-light-subtle">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-diagram-3-fill text-primary fs-4"></i>
                <span class="fw-bold">Teorie Grafů</span>
                <span class="badge bg-primary bg-opacity-25 text-primary-emphasis ms-1 small">MENDELU</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link{% if request.url.path == '/' %} active{% endif %}" href="/">
                            <i class="bi bi-house-door me-1"></i>Domů
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if '/generate' in request.url.path %} active{% endif %}" href="/generate">
                            <i class="bi bi-plus-circle me-1"></i>Generovat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if '/export' in request.url.path %} active{% endif %}" href="/export">
                            <i class="bi bi-download me-1"></i>Export
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if '/docs-algorithms' in request.url.path %} active{% endif %}" href="/docs-algorithms">
                            <i class="bi bi-book me-1"></i>Dokumentace
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-top border-light-subtle mt-auto py-3">
        <div class="container text-center text-muted small">
            <p class="mb-0">
                <i class="bi bi-mortarboard-fill me-1"></i>
                Teorie Grafů — Mendelova univerzita v Brně | PEF
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/static/js/app.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
